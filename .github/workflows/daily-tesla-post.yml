name: Daily Auto Tesla Chronicles Post

on:
  schedule:
    # 매일 한국 시간 오전 9시 00분 (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 수동으로 'Run workflow' 클릭 실행 가능

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: ⚙️ Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      - name: 🤖 테슬라 최신 뉴스 및 심층 칼럼 자동 생성 (Gemini AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate_tesla_post.mjs

      - name: 🚀 워드프레스(trip-now.kr) 자동 발행 배포
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_WP_PATH: domains/trip-now.kr/public_html
          SITE_URL: https://trip-now.kr
        run: |
          python scripts/publish_to_wp.py

      - name: 💾 생성된 글 Git 저장소에 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ data/posts_history.json
          git commit -m "Auto: daily Tesla Chronicles post $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push origin main
